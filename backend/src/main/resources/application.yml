server:
  port: 8080

spring:
  application:
    name: lifeadmin-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lifeadmin}
    username: ${DB_USERNAME:lifeadmin}
    password: ${DB_PASSWORD:lifeadmin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Gemini AI Integration Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  timeout-seconds: ${GEMINI_TIMEOUT:60}

# LifeAdmin application settings
lifeadmin:
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
